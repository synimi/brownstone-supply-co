  <link rel="stylesheet" href="styles.css">
  <style>
    .page-error {
      background: #110f0e;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .error-hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
      padding: 60px 20px;
    }

    .error-hero::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(135deg, rgba(230, 187, 124, 0.08), transparent 40%),
        radial-gradient(circle at center, rgba(230, 187, 124, 0.04), transparent 60%);
      pointer-events: none;
    }

    .error-content {
      position: relative;
      z-index: 2;
      text-align: center;
      max-width: 700px;
    }

    .error-code {
      font-size: clamp(6rem, 15vw, 12rem);
      font-weight: 900;
      line-height: 0.9;
      color: #e6bb7c;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -0.05em;
      font-family: 'Inter', Arial, sans-serif;
    }

    .error-title {
      font-size: clamp(1.8rem, 5vw, 2.8rem);
      font-weight: 800;
      margin: 20px 0 16px;
      color: #fff;
    }

    .error-description {
      font-size: 1.05rem;
      color: rgba(255, 255, 255, 0.78);
      line-height: 1.7;
      margin: 0 0 40px;
      font-weight: 300;
    }

    .error-actions {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .error-button {
      padding: 14px 32px;
      border-radius: 10px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      transition: all 0.3s ease;
    }

    .error-button-primary {
      background: #e6bb7c;
      color: #110f0e;
    }

    .error-button-primary:hover {
      background: #fff;
      transform: translateY(-2px);
    }

    .error-button-secondary {
      background: rgba(230, 187, 124, 0.15);
      color: #e6bb7c;
      border: 1px solid rgba(230, 187, 124, 0.3);
    }

    .error-button-secondary:hover {
      background: rgba(230, 187, 124, 0.25);
      border-color: rgba(230, 187, 124, 0.5);
    }

    .error-figure {
      margin-top: 60px;
      opacity: 0.3;
      font-size: 6rem;
    }

    @media (max-width: 768px) {
      .error-hero {
        padding: 40px 20px;
      }

      .error-actions {
        flex-direction: column;
      }

      .error-button {
        width: 100%;
        justify-content: center;
      }
    }
  </style>
</head>

  <script>
    document.body.classList.add("js-ready");

    const stickyNav = document.querySelector(".sticky-nav");
    const backToTop = document.querySelector(".back-to-top");

    const toggleStickyNav = () => {
      if (!stickyNav) return;
      const shouldShow = window.scrollY > 110;
      stickyNav.classList.toggle("is-visible", shouldShow);
      stickyNav.setAttribute("aria-hidden", shouldShow ? "false" : "true");
    };

    const toggleBackToTop = () => {
      if (!backToTop) return;
      backToTop.classList.toggle("is-visible", window.scrollY > 420);
    };

    window.addEventListener("scroll", toggleStickyNav, { passive: true });
    window.addEventListener("scroll", toggleBackToTop, { passive: true });
    window.addEventListener("load", toggleStickyNav);
    window.addEventListener("load", toggleBackToTop);

    const mobileMenu = document.getElementById("mobile-menu");
    const mobileToggles = Array.from(document.querySelectorAll("[data-mobile-menu-toggle]"));
    const mobileClose = Array.from(document.querySelectorAll("[data-mobile-menu-close], .mobile-menu__link"));

    const setMobileExpanded = (expanded) => {
      mobileToggles.forEach((btn) => btn.setAttribute("aria-expanded", expanded ? "true" : "false"));
    };

    const openMobileMenu = () => {
      if (!mobileMenu) return;
      mobileMenu.hidden = false;
      requestAnimationFrame(() => mobileMenu.classList.add("is-open"));
      document.body.classList.add("mobile-menu-open");
      setMobileExpanded(true);
    };

    const closeMobileMenu = () => {
      if (!mobileMenu) return;
      mobileMenu.classList.remove("is-open");
      document.body.classList.remove("mobile-menu-open");
      setMobileExpanded(false);
      setTimeout(() => {
        if (!mobileMenu.classList.contains("is-open")) mobileMenu.hidden = true;
      }, 280);
    };

    mobileToggles.forEach((btn) => btn.addEventListener("click", openMobileMenu));
    mobileClose.forEach((el) => el.addEventListener("click", closeMobileMenu));
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeMobileMenu();
    });
  </script>
